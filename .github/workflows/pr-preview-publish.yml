# Reusable workflow (trusted side of the PR preview).
# Called from a `workflow_run` workflow in the docs repo, so it runs in the base repository
# context with a write token. It NEVER checks out or executes pull request code. It only
# validates the artifact (names, PDF signature, size), pushes PDFs to the `previews` branch,
# updates the sticky comment and sets the `preview-current` commit status.
name: docengine PR preview (publish)

on:
  workflow_call:
    inputs:
      engine-repository:
        type: string
        required: true
      engine-ref:
        type: string
        required: true
      previews-branch:
        type: string
        default: previews

permissions:
  contents: read

jobs:
  publish:
    name: Publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: write # push to the previews branch
      pull-requests: write # sticky comment
      statuses: write # preview-current
      actions: read # download the build artifact
    concurrency:
      group: docengine-publish-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine-repository }}
          ref: ${{ inputs.engine-ref }}
          path: .docengine-action
          sparse-checkout: action
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download preview report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docengine-preview
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          github-token: ${{ github.token }}

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_HINT: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREVIEWS_BRANCH: ${{ inputs.previews-branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node .docengine-action/action/scripts/main.mjs preview-publish
